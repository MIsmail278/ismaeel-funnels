<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="{{ROOT}}assets/site.css">
<style>
html,body{width:1200px;height:630px;min-height:0;overflow:hidden}
.og{width:1200px;height:630px;padding:56px 72px;display:flex;flex-direction:column;justify-content:space-between;background:var(--cream)}
.og .who{font-size:30px;gap:18px}
.og .who img{width:72px;height:72px;box-shadow:0 0 0 3px var(--orange)}
.og .kw{font:400 {{OG_SIZE}}px/1.04 var(--title);color:var(--orange);white-space:nowrap;text-transform:uppercase}
.og .t{font:500 52px/1.12 var(--hook);color:var(--ink);margin-top:6px}
</style></head>
<body><div class="og">
  <div class="who"><img src="{{ROOT}}assets/logo.jpg" alt=""><span>{{HANDLE}}</span></div>
  <div><div class="kw">{{OG_WORD}}</div><div class="t">{{OG_LINE}}</div></div>
</div></body></html>
